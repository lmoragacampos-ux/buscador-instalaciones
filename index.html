<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buscador de Instalaciones</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef3f8;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .encabezado {
      background: linear-gradient(135deg, #0f4c81, #2563eb);
      color: white;
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      margin-bottom: 18px;
    }

    .icono {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 27px;
    }

    .encabezado p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 15px;
    }

    .buscador {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .buscador label {
      display: block;
      font-weight: bold;
      color: #334155;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .boton-buscar {
      width: 100%;
      padding: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton-buscar:hover {
      background: #1d4ed8;
    }

    #resultado {
      margin-top: 18px;
    }

    .cargando {
      text-align: center;
      padding: 20px;
      color: #475569;
      font-weight: bold;
    }

    .encontrado {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .titulo-encontrado {
      background: #dcfce7;
      color: #166534;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .dato {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .dato strong {
      display: block;
      color: #475569;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .dato span {
      color: #0f172a;
      font-size: 16px;
      word-break: break-word;
    }

    .coordenadas {
      background: #eff6ff;
      border: 2px solid #93c5fd;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;
      text-align: center;
    }

    .coordenadas-titulo {
      color: #1e40af;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .coordenadas-valor {
      color: #0f172a;
      font-size: 17px;
      font-weight: bold;
      word-break: break-word;
    }

    .boton-mapa {
      display: block;
      text-decoration: none;
      background: #16a34a;
      color: white;
      padding: 17px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(22,163,74,0.25);
    }

    .boton-mapa:hover {
      background: #15803d;
    }

    .boton-nueva {
      width: 100%;
      padding: 15px;
      background: #64748b;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    .boton-nueva:hover {
      background: #475569;
    }

    .no-encontrado {
      background: #fee2e2;
      color: #991b1b;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      border: 1px solid #fecaca;
    }

    .pie {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 20px;
      padding-bottom: 10px;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .encabezado {
        padding: 22px 15px;
      }

      .encabezado h1 {
        font-size: 23px;
      }

      .buscador {
        padding: 16px;
      }

      .encontrado {
        padding: 15px;
      }

      input {
        font-size: 18px;
      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <div class="encabezado">

    <div class="icono">
      📍
    </div>

    <h1>
      Buscador de Instalaciones
    </h1>

    <p>
      Consulta información y ubicación en terreno
    </p>

  </div>


  <div class="buscador">

    <label for="instalacion">
      Número de instalación
    </label>

    <input
      type="text"
      id="instalacion"
      placeholder="Ej: 100318128 o G3569505"
      autocomplete="off"
    >

    <button
      class="boton-buscar"
      onclick="buscarInstalacion()"
    >
      🔎 BUSCAR INSTALACIÓN
    </button>

  </div>


  <div id="resultado"></div>


  <div class="pie">
    Sistema de consulta de instalaciones
  </div>


</div>


<script>


const SHEET_ID =
"17R2SGwqYpGdkl5jfQwSSpBpwQ06HL4imfaY4O5DbVWE";


const URL_CSV =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:csv";


/* NORMALIZAR */

function normalizar(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {
    return "";
  }

  return String(valor)
    .trim()
    .toUpperCase()
    .replace(/\s+/g, "");

}


/* PARSER CSV */

function parseCSV(texto) {

  const filas = [];

  let fila = [];

  let campo = "";

  let dentroComillas = false;


  for (
    let i = 0;
    i < texto.length;
    i++
  ) {

    const caracter = texto[i];

    const siguiente = texto[i + 1];


    if (
      caracter === '"' &&
      dentroComillas &&
      siguiente === '"'
    ) {

      campo += '"';

      i++;

      continue;

    }


    if (
      caracter === '"'
    ) {

      dentroComillas =
        !dentroComillas;

      continue;

    }


    if (
      caracter === "," &&
      !dentroComillas
    ) {

      fila.push(campo);

      campo = "";

      continue;

    }


    if (
      (caracter === "\n" ||
       caracter === "\r") &&
      !dentroComillas
    ) {

      if (
        caracter === "\r" &&
        siguiente === "\n"
      ) {
        i++;
      }

      fila.push(campo);

      campo = "";


      if (fila.length > 1) {
        filas.push(fila);
      }

      fila = [];

      continue;

    }


    campo += caracter;

  }


  if (campo !== "" || fila.length > 0) {

    fila.push(campo);

    if (fila.length > 1) {
      filas.push(fila);
    }

  }


  return filas;

}


/* BUSCAR */

async function buscarInstalacion() {


  const instalacion =
    normalizar(
      document
        .getElementById("instalacion")
        .value
    );


  const resultado =
    document.getElementById("resultado");


  if (
    instalacion === ""
  ) {

    resultado.innerHTML = `

      <div class="no-encontrado">

        ⚠️

        <strong>
          Ingresa una instalación
        </strong>

      </div>

    `;

    return;

  }


  resultado.innerHTML = `

    <div class="cargando">

      🔎 Consultando información...

    </div>

  `;


  try {


    const respuesta =
      await fetch(URL_CSV);


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo acceder a Google Sheets"
      );

    }


    const texto =
      await respuesta.text();


    const filas =
      parseCSV(texto);


    if (
      filas.length < 2
    ) {

      throw new Error(
        "No hay datos en la planilla"
      );

    }


    /*
      PRIMERA FILA = ENCABEZADOS
      SEGUNDA FILA EN ADELANTE = DATOS
    */

    const encabezados =
      filas[0];


    let encontrado = null;


    for (
      let i = 1;
      i < filas.length;
      i++
    ) {


      const fila =
        filas[i];


      /*
        INSTALACION = COLUMNA B
        ÍNDICE 1
      */

      const valor =
        normalizar(
          fila[1]
        );


      if (
        valor ===
        instalacion
      ) {

        encontrado = fila;

        break;

      }

    }


    if (!encontrado) {


      resultado.innerHTML = `

        <div class="no-encontrado">

          ❌

          <strong>
            INSTALACIÓN NO ENCONTRADA
          </strong>

          <br><br>

          No existe información para:

          <br>

          <strong>
            ${instalacion}
          </strong>

        </div>

      `;

      return;

    }


    /* MOSTRAR DATOS */

    let datosHTML = "";


    encabezados.forEach(
      (encabezado, indice) => {


        const nombre =
          encabezado.trim();


        const valor =
          encontrado[indice]
          || "";


        if (
          valor === ""
        ) {
          return;
        }


        if (
          normalizar(nombre)
          === "COORDENADAS"
        ) {

          return;

        }


        datosHTML += `

          <div class="dato">

            <strong>
              ${nombre}
            </strong>

            <span>
              ${valor}
            </span>

          </div>

        `;

      }
    );


    resultado.innerHTML = `

      <div class="encontrado">

        <div class="titulo-encontrado">

          ✅ INSTALACIÓN ENCONTRADA

        </div>

        ${datosHTML}

      </div>

    `;


    /* COORDENADAS */

    const indiceCoordenadas =
      encabezados.findIndex(
        encabezado =>
          normalizar(encabezado)
          === "COORDENADAS"
      );


    let coordenadas = "";


    if (
      indiceCoordenadas >= 0
    ) {

      coordenadas =
        (
          encontrado[
            indiceCoordenadas
          ] || ""
        ).trim();

    }


    /* MAPA */

    if (
      coordenadas !== ""
    ) {


      const partes =
        coordenadas.split(",");


      if (
        partes.length >= 2
      ) {


        const latitud =
          partes[0].trim();


        const longitud =
          partes[1].trim();


        const mapa =
          "https://www.google.com/maps?q=" +
          encodeURIComponent(
            latitud +
            "," +
            longitud
          );


        resultado.innerHTML += `

          <div class="coordenadas">

            <div class="coordenadas-titulo">

              📍 COORDENADAS

            </div>

            <div class="coordenadas-valor">

              ${coordenadas}

            </div>

          </div>


          <a
            class="boton-mapa"
            href="${mapa}"
            target="_blank"
            rel="noopener noreferrer"
          >

            🧭 ABRIR UBICACIÓN EN GOOGLE MAPS

          </a>


          <button
            class="boton-nueva"
            onclick="nuevaBusqueda()"
          >

            🔄 NUEVA BÚSQUEDA

          </button>

        `;

      }

    }


  }


  catch (error) {


    console.error(error);


    resultado.innerHTML = `

      <div class="no-encontrado">

        ⚠️

        <strong>
          No se pudo consultar la base de datos
        </strong>

        <br><br>

        Revisa que la planilla esté compartida
        como "Cualquier persona con el enlace".

      </div>

    `;

  }

}


/* NUEVA BÚSQUEDA */

function nuevaBusqueda() {

  document
    .getElementById("instalacion")
    .value = "";

  document
    .getElementById("resultado")
    .innerHTML = "";

  document
    .getElementById("instalacion")
    .focus();

}


/* ENTER */

document
  .getElementById("instalacion")
  .addEventListener(
    "keypress",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        buscarInstalacion();

      }

    }
  );


</script>


</body>

</html>
