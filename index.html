<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscador de Instalaciones</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.header {
    background: linear-gradient(135deg, #075985, #0284c7);
    color: white;
    padding: 28px 20px 35px;
    text-align: center;
    border-radius: 0 0 25px 25px;
}

.header .icon {
    font-size: 42px;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 8px 0 0;
    opacity: 0.9;
}

.container {
    max-width: 650px;
    margin: -20px auto 40px;
    padding: 0 15px;
}

.search-card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

.search-card label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.search-box {
    display: flex;
    gap: 10px;
}

.search-box input {
    flex: 1;
    padding: 15px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.search-box input:focus {
    border-color: #0284c7;
}

.search-box button {
    border: none;
    background: #0284c7;
    color: white;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.search-box button:hover {
    background: #0369a1;
}

.resultado {
    margin-top: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card-title {
    font-size: 20px;
    font-weight: bold;
    color: #075985;
    margin-bottom: 15px;
}

.dato {
    padding: 10px 0;
    border-bottom: 1px solid #e2e8f0;
}

.dato:last-child {
    border-bottom: none;
}

.dato strong {
    display: block;
    font-size: 13px;
    color: #64748b;
    margin-bottom: 4px;
}

.dato span {
    font-size: 16px;
    word-break: break-word;
}

.coordenadas {
    background: #f0fdf4;
    border: 2px solid #86efac;
    border-radius: 14px;
    padding: 15px;
    margin-top: 15px;
}

.coordenadas strong {
    color: #166534;
}

.maps-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #16a34a;
    color: white;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
    margin-top: 12px;
}

.maps-btn:hover {
    background: #15803d;
}

.nueva-btn {
    display: block;
    width: 100%;
    border: none;
    background: #e2e8f0;
    color: #334155;
    padding: 13px;
    border-radius: 12px;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

.nueva-btn:hover {
    background: #cbd5e1;
}

.mensaje {
    text-align: center;
    padding: 25px 10px;
    font-weight: bold;
}

.error {
    color: #dc2626;
}

.loading {
    color: #0369a1;
}

@media (max-width: 500px) {

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        padding: 14px;
    }

    .header h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="icon">📍</div>
    <h1>Buscador de Instalaciones</h1>
    <p>Consulta información y ubicación de instalaciones</p>
</div>

<div class="container">

    <div class="search-card">

        <label for="instalacion">Número de instalación</label>

        <div class="search-box">
            <input
                type="text"
                id="instalacion"
                placeholder="Ej: 100318128 o G3569505"
                autocomplete="off"
            >

            <button onclick="buscar()">
                Buscar
            </button>
        </div>

    </div>

    <div id="resultado" class="resultado"></div>

</div>

<script>

const SHEET_ID = "17R2SGwqYpGdkl5jfQwSSpBpwQ06HL4imfaY4O5DbVWE";

/*
    IMPORTANTE:
    Usamos la exportación directa CSV de Google Sheets.
    Esto evita el problema de Google al interpretar
    la columna INSTALACION como numérica.
*/
const URL_CSV =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/export?format=csv";


// Normaliza la instalación ingresada
function normalizar(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "");
}


// Parser CSV
function parseCSV(texto) {

    const filas = [];
    let fila = [];
    let campo = "";
    let dentroComillas = false;

    for (let i = 0; i < texto.length; i++) {

        const caracter = texto[i];
        const siguiente = texto[i + 1];

        if (caracter === '"') {

            if (dentroComillas && siguiente === '"') {
                campo += '"';
                i++;
            } else {
                dentroComillas = !dentroComillas;
            }

        } else if (caracter === "," && !dentroComillas) {

            fila.push(campo);
            campo = "";

        } else if (
            (caracter === "\n" || caracter === "\r") &&
            !dentroComillas
        ) {

            if (caracter === "\r" && siguiente === "\n") {
                i++;
            }

            fila.push(campo);
            filas.push(fila);

            fila = [];
            campo = "";

        } else {

            campo += caracter;
        }
    }

    if (campo !== "" || fila.length > 0) {
        fila.push(campo);
        filas.push(fila);
    }

    return filas;
}


// Buscar instalación
async function buscar() {

    const input = document.getElementById("instalacion");
    const resultado = document.getElementById("resultado");

    const buscada = normalizar(input.value);

    if (!buscada) {

        resultado.innerHTML =
            '<div class="card mensaje error">' +
            'Ingresa un número de instalación.' +
            '</div>';

        return;
    }

    resultado.innerHTML =
        '<div class="card mensaje loading">🔎 Buscando instalación...</div>';

    try {

        // Evita utilizar una versión antigua de la hoja guardada en caché
        const respuesta = await fetch(
            URL_CSV + "&t=" + Date.now()
        );

        if (!respuesta.ok) {
            throw new Error("No se pudo acceder a la planilla.");
        }

        const texto = await respuesta.text();

        const filas = parseCSV(texto);

        if (!filas || filas.length < 2) {
            throw new Error("La planilla no contiene datos.");
        }

        // La primera fila corresponde a los encabezados
        const encabezados = filas[0];

        let encontrada = null;

        // Recorremos todas las filas
        for (let i = 1; i < filas.length; i++) {

            const fila = filas[i];

            // INSTALACION está en la columna B
            const instalacion = normalizar(fila[1]);

            if (instalacion === buscada) {
                encontrada = fila;
                break;
            }
        }

        if (!encontrada) {

            resultado.innerHTML =
                '<div class="card mensaje error">' +
                '❌ INSTALACIÓN NO ENCONTRADA<br><br>' +
                '<span style="font-weight:normal;color:#64748b;">' +
                'Verifica que el número esté escrito correctamente.' +
                '</span>' +
                '</div>';

            return;
        }

        mostrarResultado(encontrada);

    } catch (error) {

        console.error(error);

        resultado.innerHTML =
            '<div class="card mensaje error">' +
            '❌ Ocurrió un problema al consultar la planilla.<br><br>' +
            '<span style="font-weight:normal;color:#64748b;">' +
            error.message +
            '</span>' +
            '</div>';
    }
}


// Mostrar resultado
function mostrarResultado(fila) {

    const resultado = document.getElementById("resultado");

    const proceso = fila[0] || "";
    const instalacion = fila[1] || "";
    const unidad = fila[2] || "";
    const direccion = fila[3] || "";
    const poste = fila[4] || "";
    const serie = fila[5] || "";
    const marca = fila[6] || "";
    const tipo = fila[7] || "";
    const usuario = fila[8] || "";
    const nota = fila[9] || "";
    const coordenadas = fila[10] || "";

    let html = `
        <div class="card">

            <div class="card-title">
                📍 Instalación ${escapeHTML(instalacion)}
            </div>

            <div class="dato">
                <strong>PROCESO</strong>
                <span>${escapeHTML(proceso)}</span>
            </div>

            <div class="dato">
                <strong>INSTALACION</strong>
                <span>${escapeHTML(instalacion)}</span>
            </div>

            <div class="dato">
                <strong>UNIDAD DE LECTURA</strong>
                <span>${escapeHTML(unidad)}</span>
            </div>

            <div class="dato">
                <strong>DIRECCIÓN</strong>
                <span>${escapeHTML(direccion)}</span>
            </div>

            <div class="dato">
                <strong>NÚMERO DE POSTE</strong>
                <span>${escapeHTML(poste)}</span>
            </div>

            <div class="dato">
                <strong>NÚMERO DE SERIE</strong>
                <span>${escapeHTML(serie)}</span>
            </div>

            <div class="dato">
                <strong>MARCA</strong>
                <span>${escapeHTML(marca)}</span>
            </div>

            <div class="dato">
                <strong>TIPO DE NUMERADOR</strong>
                <span>${escapeHTML(tipo)}</span>
            </div>

            <div class="dato">
                <strong>USUARIO</strong>
                <span>${escapeHTML(usuario)}</span>
            </div>

            <div class="dato">
                <strong>NOTA LECTURA</strong>
                <span>${escapeHTML(nota)}</span>
            </div>

            <div class="coordenadas">

                <div class="dato" style="border:none;padding:0;">
                    <strong>📍 COORDENADAS</strong>
                    <span>${escapeHTML(coordenadas)}</span>
                </div>
    `;


    // Crear botón Google Maps si existen coordenadas
    const partes = coordenadas
        .split(",")
        .map(x => x.trim());

    if (
        partes.length === 2 &&
        !isNaN(parseFloat(partes[0])) &&
        !isNaN(parseFloat(partes[1]))
    ) {

        const lat = parseFloat(partes[0]);
        const lon = parseFloat(partes[1]);

        const mapsURL =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(lat + "," + lon);

        html += `
            <a
                class="maps-btn"
                href="${mapsURL}"
                target="_blank"
                rel="noopener noreferrer"
            >
                🗺️ Abrir ubicación en Google Maps
            </a>
        `;
    }

    html += `
            </div>

            <button class="nueva-btn" onclick="nuevaBusqueda()">
                🔄 Nueva búsqueda
            </button>

        </div>
    `;

    resultado.innerHTML = html;
}


// Evita que datos de la planilla puedan romper el HTML
function escapeHTML(valor) {

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// Nueva búsqueda
function nuevaBusqueda() {

    document.getElementById("instalacion").value = "";

    document.getElementById("resultado").innerHTML = "";

    document.getElementById("instalacion").focus();
}


// Permitir buscar presionando ENTER
document
    .getElementById("instalacion")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            buscar();
        }

    });

</script>

</body>
</html>
