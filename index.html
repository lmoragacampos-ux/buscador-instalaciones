<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscador de Instalaciones</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  color: #222;
}

.header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  padding: 28px 20px;
  text-align: center;
}

.header .icon {
  font-size: 42px;
}

.header h1 {
  margin: 5px 0;
  font-size: 25px;
}

.header p {
  margin: 8px 0 0;
  opacity: .9;
}

.container {
  max-width: 700px;
  margin: 25px auto;
  padding: 0 15px;
}

.search-box {
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.10);
}

.search-box label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

.search-row {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 9px;
  outline: none;
}

button {
  border: none;
  border-radius: 9px;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.search-btn {
  background: #1976d2;
  color: white;
}

.message {
  text-align: center;
  margin-top: 20px;
  font-weight: bold;
}

.card {
  background: white;
  margin-top: 20px;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.10);
}

.card h2 {
  margin-top: 0;
  color: #0d47a1;
}

.dato {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.dato strong {
  display: block;
  color: #555;
  font-size: 13px;
  margin-bottom: 4px;
}

.coordenadas {
  background: #e8f5e9;
  color: #1b5e20;
  padding: 12px;
  border-radius: 9px;
  font-weight: bold;
}

.maps-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  background: #2e7d32;
  color: white;
  text-align: center;
  text-decoration: none;
  padding: 14px;
  border-radius: 9px;
  font-weight: bold;
}

.new-btn {
  width: 100%;
  margin-top: 15px;
  background: #eee;
}

.hidden {
  display: none;
}

@media(max-width:600px) {
  .search-row {
    flex-direction: column;
  }

  .search-btn {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="icon">📍</div>
  <h1>Buscador de Instalaciones</h1>
  <p>Consulta información de la instalación</p>
</div>

<div class="container">

  <div class="search-box">

    <label for="instalacion">
      Ingrese instalación
    </label>

    <div class="search-row">

      <input
        id="instalacion"
        type="text"
        placeholder="Ej: 100318128 o G3569505"
        autocomplete="off"
      >

      <button
        class="search-btn"
        onclick="buscar()">
        Buscar
      </button>

    </div>

  </div>

  <div id="mensaje" class="message"></div>

  <div id="resultado" class="card hidden"></div>

</div>


<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSP7QGODGQVBoUvpZ_61N0AfH5NhvdZX0TKYHof5xyA8hyjPu0TKF0ackdCICQJ5toMVvJr7qNMinzL/pub?gid=0&single=true&output=csv";


function normalizar(valor) {

  if (valor === null || valor === undefined) {
    return "";
  }

  return String(valor)
    .trim()
    .toUpperCase()
    .replace(/\s+/g, "");

}


/* Lector CSV */
function leerCSV(texto) {

  const filas = [];
  let fila = [];
  let campo = "";
  let comillas = false;

  for (let i = 0; i < texto.length; i++) {

    const caracter = texto[i];

    if (caracter === '"') {

      if (comillas && texto[i + 1] === '"') {
        campo += '"';
        i++;
      } else {
        comillas = !comillas;
      }

    } else if (caracter === "," && !comillas) {

      fila.push(campo);
      campo = "";

    } else if (
      (caracter === "\n" || caracter === "\r") &&
      !comillas
    ) {

      if (caracter === "\r" && texto[i + 1] === "\n") {
        i++;
      }

      fila.push(campo);
      filas.push(fila);

      fila = [];
      campo = "";

    } else {

      campo += caracter;

    }

  }

  if (campo !== "" || fila.length > 0) {
    fila.push(campo);
    filas.push(fila);
  }

  return filas;
}


async function buscar() {

  const buscada =
    normalizar(
      document.getElementById("instalacion").value
    );

  const mensaje =
    document.getElementById("mensaje");

  const resultado =
    document.getElementById("resultado");


  resultado.classList.add("hidden");
  resultado.innerHTML = "";
  mensaje.innerHTML = "";


  if (!buscada) {

    mensaje.innerHTML =
      "⚠️ Ingresa una instalación.";

    return;
  }


  mensaje.innerHTML =
    "🔎 Buscando...";


  try {

    const respuesta =
      await fetch(
        CSV_URL + "&t=" + Date.now()
      );


    if (!respuesta.ok) {
      throw new Error(
        "No se pudo leer el archivo CSV."
      );
    }


    const texto =
      await respuesta.text();


    const filas =
      leerCSV(texto);


    if (filas.length < 2) {

      throw new Error(
        "El archivo no contiene datos."
      );

    }


    /*
      Columnas:

      0 PROCESO
      1 INSTALACION
      2 UNIDAD DE LECTURA
      3 DIRECCION
      4 NUMERO DE POSTE
      5 NUMERO DE SERIE
      6 MARCA
      7 TIPO DE NUMERADOR
      8 USUARIO
      9 NOTA LECTURA
      10 COORDENADAS
    */


    let encontrada = null;


    for (let i = 1; i < filas.length; i++) {

      const fila = filas[i];

      if (!fila || fila.length < 2) {
        continue;
      }


      const instalacion =
        normalizar(fila[1]);


      if (instalacion === buscada) {

        encontrada = fila;
        break;

      }

    }


    if (!encontrada) {

      mensaje.innerHTML =
        "❌ No se encontró la instalación <b>" +
        buscada +
        "</b>.";

      return;
    }


    const proceso = encontrada[0] || "";
    const instalacion = encontrada[1] || "";
    const unidad = encontrada[2] || "";
    const direccion = encontrada[3] || "";
    const poste = encontrada[4] || "";
    const serie = encontrada[5] || "";
    const marca = encontrada[6] || "";
    const tipo = encontrada[7] || "";
    const usuario = encontrada[8] || "";
    const nota = encontrada[9] || "";
    const coordenadas = encontrada[10] || "";


    let botonMapa = "";


    const match =
      String(coordenadas).match(
        /(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/
      );


    if (match) {

      const lat = match[1];
      const lon = match[2];


      const mapsUrl =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(lat + "," + lon);


      botonMapa =
        '<a class="maps-btn" href="' +
        mapsUrl +
        '" target="_blank">' +
        "📍 Abrir ubicación en Google Maps" +
        "</a>";

    }


    mensaje.innerHTML =
      "✅ Instalación encontrada";


    resultado.innerHTML = `

      <h2>📍 Instalación ${instalacion}</h2>

      ${dato("Proceso", proceso)}

      ${dato("Instalación", instalacion)}

      ${dato("Unidad de lectura", unidad)}

      ${dato("Dirección", direccion)}

      ${dato("Número de poste", poste)}

      ${dato("Número de serie", serie)}

      ${dato("Marca", marca)}

      ${dato("Tipo de numerador", tipo)}

      ${dato("Usuario", usuario)}

      ${dato("Nota lectura", nota)}

      <div class="dato">

        <strong>Coordenadas</strong>

        <div class="coordenadas">
          ${coordenadas || "Sin coordenadas"}
        </div>

        ${botonMapa}

      </div>

      <button
        class="new-btn"
        onclick="nuevaBusqueda()">
        🔎 Nueva búsqueda
      </button>

    `;


    resultado.classList.remove("hidden");


  } catch (error) {

    console.error(error);

    mensaje.innerHTML =
      "❌ Error al leer los datos de Google Sheets.";

  }

}


function dato(nombre, valor) {

  return `
    <div class="dato">
      <strong>${nombre}</strong>
      <div>${valor || "—"}</div>
    </div>
  `;

}


function nuevaBusqueda() {

  document.getElementById(
    "instalacion"
  ).value = "";

  document.getElementById(
    "mensaje"
  ).innerHTML = "";

  document.getElementById(
    "resultado"
  ).innerHTML = "";

  document.getElementById(
    "resultado"
  ).classList.add("hidden");

  document.getElementById(
    "instalacion"
  ).focus();

}


document.getElementById(
  "instalacion"
).addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      buscar();
    }

  }
);

</script>

</body>
</html>
