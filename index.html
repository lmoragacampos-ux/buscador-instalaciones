<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Google Sheets</title>
</head>

<body style="font-family:Arial;padding:20px">

<h2>Prueba de conexión</h2>

<button onclick="probar()">LEER GOOGLE SHEETS</button>

<pre id="resultado" style="
  white-space:pre-wrap;
  background:#eee;
  padding:15px;
  margin-top:20px;
"></pre>

<script>

const SHEET_ID =
"17R2SGwqYpGdkl5jfQwSSpBpwQ06HL4imfaY4O5DbVWE";

async function probar() {

  const resultado =
    document.getElementById("resultado");

  resultado.innerText = "Leyendo...";

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?tqx=out:json&sheet=Hoja%201";

  try {

    const respuesta = await fetch(url);

    const texto = await respuesta.text();

    console.log(texto);

    const inicio = texto.indexOf("{");
    const fin = texto.lastIndexOf("}");

    if (inicio === -1 || fin === -1) {
      resultado.innerText =
        "Google no devolvió datos JSON.\n\n" +
        texto.substring(0,1000);

      return;
    }

    const datos =
      JSON.parse(
        texto.substring(inicio, fin + 1)
      );

    resultado.innerText =
      JSON.stringify(datos, null, 2);

  } catch (error) {

    resultado.innerText =
      "ERROR:\n\n" +
      error;

  }

}

</script>

</body>
</html>
